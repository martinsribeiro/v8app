name: Compilar iOS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Organizar pastas do projeto
        run: |
          mkdir -p V8 V8.xcodeproj
          for f in *.swift; do [ -f "$f" ] && mv "$f" V8/; done
          [ -f project.pbxproj ] && mv project.pbxproj V8.xcodeproj/
          ls -R V8 V8.xcodeproj

      - name: Versao do Xcode
        run: xcodebuild -version

      - name: Compilar (sem assinatura)
        run: |
          xcodebuild -project V8.xcodeproj -target V8 -configuration Release \
            -sdk iphoneos SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || true
          echo "===== ERROS / AVISOS ====="
          grep -E "error:|warning:" build.log | sort -u | head -80 || true
          echo "===== FIM DO REGISTO ====="
          tail -n 40 build.log
          echo "===== CONTEUDO DA APP ====="
          ls -la build/Release-iphoneos/V8.app || true
          test -f build/Release-iphoneos/V8.app/V8

      - name: Criar V8.ipa
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/V8.app Payload/
          zip -qry V8.ipa Payload
          ls -la V8.ipa

      - name: Guardar V8.ipa
        uses: actions/upload-artifact@v4
        with:
          name: V8-ipa
          path: V8.ipa

      - name: Guardar registo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
